name: Weekly Full Backtest

# Comprehensive weekly backtesting with higher simulation count
# Schedule: 2:00 AM UTC every Sunday

on:
  schedule:
    - cron: '0 2 * * 0'  # 2:00 AM UTC every Sunday
  workflow_dispatch:  # Allow manual trigger
    inputs:
      simulations:
        description: 'Number of Monte Carlo simulations'
        required: false
        default: '10000'
      scenario:
        description: 'Battle Test scenario (A, B, C)'
        required: false
        default: 'A'

env:
  PYTHON_VERSION: '3.11'

jobs:
  full-backtest:
    name: Full Backtest Suite
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Collect fresh data
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
        run: python main.py collect --source all

      - name: Run Battle Test - All Scenarios
        run: |
          SCENARIO="${{ github.event.inputs.scenario || 'A' }}"
          echo "Running Battle Test with scenario $SCENARIO"
          python main.py battle-test --scenario $SCENARIO

      - name: Run Monte Carlo - High Simulation Count
        run: |
          SIMS="${{ github.event.inputs.simulations || '10000' }}"
          echo "Running Monte Carlo with $SIMS simulations"
          python main.py monte-carlo --simulations $SIMS --seed 42

      - name: Run Anomaly Detection
        run: python main.py anomaly

      - name: Run Protocol Monitoring
        run: python main.py monitor

      - name: Generate Dream Mode Export
        run: python main.py dream-mode-export

      - name: Generate All Adelaide Personas
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          # Generate for all personas in both locales
          python main.py adelaide --persona all --locale en --format newsletter_md,twitter_thread,linkedin_post
          python main.py adelaide --persona all --locale pt-br --format newsletter_md

      - name: Upload all outputs
        uses: actions/upload-artifact@v4
        with:
          name: weekly-backtest-results
          path: outputs/
          retention-days: 90

      - name: Generate summary report
        run: |
          echo "# Weekly Backtest Summary" > outputs/weekly_summary.md
          echo "" >> outputs/weekly_summary.md
          echo "**Date:** $(date -u +%Y-%m-%d)" >> outputs/weekly_summary.md
          echo "**Simulations:** ${{ github.event.inputs.simulations || '10000' }}" >> outputs/weekly_summary.md
          echo "**Scenario:** ${{ github.event.inputs.scenario || 'A' }}" >> outputs/weekly_summary.md
          echo "" >> outputs/weekly_summary.md
          echo "## Files Generated" >> outputs/weekly_summary.md
          find outputs/ -type f -name "*.md" -o -name "*.json" -o -name "*.csv" | sort >> outputs/weekly_summary.md

      - name: Upload summary
        uses: actions/upload-artifact@v4
        with:
          name: weekly-summary
          path: outputs/weekly_summary.md
          retention-days: 90

  notify:
    name: Send Notification
    runs-on: ubuntu-latest
    needs: full-backtest
    if: always()

    steps:
      - name: Send Slack notification
        if: ${{ secrets.SLACK_WEBHOOK_URL != '' }}
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "attachments": [
                {
                  "color": "${{ needs.full-backtest.result == 'success' && 'good' || 'danger' }}",
                  "blocks": [
                    {
                      "type": "section",
                      "text": {
                        "type": "mrkdwn",
                        "text": "*diBoaS Weekly Backtest*\nStatus: ${{ needs.full-backtest.result }}\nSimulations: ${{ github.event.inputs.simulations || '10000' }}"
                      }
                    },
                    {
                      "type": "context",
                      "elements": [
                        {
                          "type": "mrkdwn",
                          "text": "Run: <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Details>"
                        }
                      ]
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
