name: Daily Pipeline

# Automated daily pipeline: collect → analyze → generate Adelaide
# Schedule: 6:00 AM UTC daily

on:
  schedule:
    - cron: '0 6 * * *'  # 6:00 AM UTC daily
  workflow_dispatch:  # Allow manual trigger
    inputs:
      persona:
        description: 'Adelaide persona (ana, maria, felipe, all)'
        required: false
        default: 'all'
      offline:
        description: 'Use offline data only'
        required: false
        default: 'false'
        type: boolean

env:
  PYTHON_VERSION: '3.11'

jobs:
  collect:
    name: Collect Market Data
    runs-on: ubuntu-latest
    outputs:
      data_collected: ${{ steps.collect.outputs.success }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Collect data
        id: collect
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
        run: |
          if [ "${{ github.event.inputs.offline }}" = "true" ]; then
            python main.py collect --offline
          else
            python main.py collect --source all
          fi
          echo "success=true" >> $GITHUB_OUTPUT

      - name: Upload collected data
        uses: actions/upload-artifact@v4
        with:
          name: collected-data
          path: data/
          retention-days: 7

  analyze:
    name: Run Analytics
    runs-on: ubuntu-latest
    needs: collect
    outputs:
      analysis_complete: ${{ steps.analyze.outputs.success }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download collected data
        uses: actions/download-artifact@v4
        with:
          name: collected-data
          path: data/

      - name: Run Battle Test
        run: python main.py battle-test --scenario A

      - name: Run Monte Carlo
        id: analyze
        run: |
          python main.py monte-carlo --simulations 5000
          echo "success=true" >> $GITHUB_OUTPUT

      - name: Upload analysis results
        uses: actions/upload-artifact@v4
        with:
          name: analysis-results
          path: outputs/
          retention-days: 30

  generate:
    name: Generate Adelaide Newsletters
    runs-on: ubuntu-latest
    needs: analyze

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download analysis results
        uses: actions/download-artifact@v4
        with:
          name: analysis-results
          path: outputs/

      - name: Generate Adelaide newsletters
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          PERSONA="${{ github.event.inputs.persona || 'all' }}"
          python main.py adelaide --persona $PERSONA --locale en --format newsletter_md,twitter_thread
          python main.py adelaide --persona $PERSONA --locale pt-br --format newsletter_md

      - name: Upload Adelaide outputs
        uses: actions/upload-artifact@v4
        with:
          name: adelaide-newsletters
          path: outputs/adelaide/
          retention-days: 30

  notify:
    name: Send Notification
    runs-on: ubuntu-latest
    needs: [collect, analyze, generate]
    if: always()

    steps:
      - name: Prepare status message
        id: status
        run: |
          if [ "${{ needs.collect.result }}" = "success" ] && \
             [ "${{ needs.analyze.result }}" = "success" ] && \
             [ "${{ needs.generate.result }}" = "success" ]; then
            echo "status=success" >> $GITHUB_OUTPUT
            echo "message=Daily pipeline completed successfully" >> $GITHUB_OUTPUT
            echo "color=good" >> $GITHUB_OUTPUT
          else
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "message=Daily pipeline failed - check workflow logs" >> $GITHUB_OUTPUT
            echo "color=danger" >> $GITHUB_OUTPUT
          fi

      - name: Send Slack notification
        if: ${{ secrets.SLACK_WEBHOOK_URL != '' }}
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "attachments": [
                {
                  "color": "${{ steps.status.outputs.color }}",
                  "blocks": [
                    {
                      "type": "section",
                      "text": {
                        "type": "mrkdwn",
                        "text": "*diBoaS Daily Pipeline*\n${{ steps.status.outputs.message }}"
                      }
                    },
                    {
                      "type": "context",
                      "elements": [
                        {
                          "type": "mrkdwn",
                          "text": "Run: <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Details>"
                        }
                      ]
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
