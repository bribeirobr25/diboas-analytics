# TICKER_MASTER_LIST.yaml
# 
# Purpose: Consolidated reference of all tickers used in diBoaS Analytics pipeline
# Created: January 24, 2026
# Updated: January 24, 2026
# Owner: Rakia
# Change Log:
#   - v1: Initial creation (GAP-016 fix)
#
# Usage: This file serves as the single source of truth for all ticker symbols
# used across the data collection pipeline. CTO Board should reference this file
# when building automation to ensure consistency.

---

# =============================================================================
# EQUITY INDICES
# =============================================================================

equity_indices:
  # Required - Always collect
  required:
    - symbol: "^GSPC"
      name: "S&P 500"
      source: "Yahoo Finance"
      data_type: "index"
      frequency: "daily"
      used_in: ["tradfi_benchmark_data.csv", "rotation_indicators.csv"]
      
    - symbol: "^IXIC"
      name: "NASDAQ Composite"
      source: "Yahoo Finance"
      data_type: "index"
      frequency: "daily"
      used_in: ["tradfi_benchmark_data.csv"]
      
    - symbol: "^VIX"
      name: "CBOE Volatility Index"
      source: "Yahoo Finance"
      data_type: "index"
      frequency: "daily"
      used_in: ["tradfi_benchmark_data.csv", "anomaly_detection"]
      alert_thresholds:
        warning: 25
        elevated: 30
        critical: 40
  
  # Regional - Important for Adelaide context
  regional:
    - symbol: "^STOXX50E"
      name: "Euro Stoxx 50"
      source: "Yahoo Finance"
      region: "EU"
      
    - symbol: "^GDAXI"
      name: "DAX"
      source: "Yahoo Finance"
      region: "Germany"
      
    - symbol: "^BVSP"
      name: "Bovespa"
      source: "Yahoo Finance"
      region: "Brazil"
      
    - symbol: "^N225"
      name: "Nikkei 225"
      source: "Yahoo Finance"
      region: "Japan"
      status: "MISSING - Add to collection"
      
    - symbol: "^HSI"
      name: "Hang Seng"
      source: "Yahoo Finance"
      region: "Hong Kong"
      status: "MISSING - Add to collection"

# =============================================================================
# ROTATION ETFs (REQUIRED for Task 1.7)
# =============================================================================

rotation_etfs:
  priority: "CRITICAL"
  note: "These ETFs are REQUIRED for capital rotation calculations"
  
  etfs:
    - symbol: "SPY"
      name: "SPDR S&P 500 ETF"
      source: "Yahoo Finance"
      frequency: "daily"
      used_in: ["tradfi_benchmark_data.csv", "rotation_indicators.csv"]
      ratios: ["SPY/TLT", "IWM/SPY"]
      
    - symbol: "TLT"
      name: "iShares 20+ Year Treasury Bond ETF"
      source: "Yahoo Finance"
      frequency: "daily"
      used_in: ["tradfi_benchmark_data.csv", "rotation_indicators.csv"]
      ratios: ["SPY/TLT"]
      
    - symbol: "XLF"
      name: "Financial Select Sector SPDR Fund"
      source: "Yahoo Finance"
      frequency: "daily"
      used_in: ["tradfi_benchmark_data.csv", "rotation_indicators.csv"]
      ratios: ["XLF/XLU"]
      
    - symbol: "XLU"
      name: "Utilities Select Sector SPDR Fund"
      source: "Yahoo Finance"
      frequency: "daily"
      used_in: ["tradfi_benchmark_data.csv", "rotation_indicators.csv"]
      ratios: ["XLF/XLU"]
      
    - symbol: "IWM"
      name: "iShares Russell 2000 ETF"
      source: "Yahoo Finance"
      frequency: "daily"
      used_in: ["tradfi_benchmark_data.csv", "rotation_indicators.csv"]
      ratios: ["IWM/SPY"]

# =============================================================================
# COMMODITIES
# =============================================================================

commodities:
  required:
    - symbol: "GC=F"
      name: "Gold Futures"
      source: "Yahoo Finance"
      unit: "USD per troy oz"
      frequency: "daily"
      used_in: ["commodities.csv", "rotation_indicators.csv"]
      ratios: ["Copper/Gold"]
      
    - symbol: "HG=F"
      name: "Copper Futures"
      source: "Yahoo Finance"
      unit: "cents per lb"
      frequency: "daily"
      used_in: ["commodities.csv", "rotation_indicators.csv"]
      ratios: ["Copper/Gold"]
      note: "Copper is in cents/lb, Gold in $/oz - raw ratio will be small (~0.0017)"
      
  optional:
    - symbol: "SI=F"
      name: "Silver Futures"
      source: "Yahoo Finance"
      
    - symbol: "CL=F"
      name: "WTI Crude Oil Futures"
      source: "Yahoo Finance"

# =============================================================================
# CURRENCIES
# =============================================================================

currencies:
  required:
    - symbol: "DX-Y.NYB"
      name: "US Dollar Index (DXY)"
      source: "Yahoo Finance"
      frequency: "daily"
      
    - symbol: "EURUSD=X"
      name: "EUR/USD"
      source: "Yahoo Finance"
      
    - symbol: "BRL=X"
      name: "BRL/USD"
      source: "Yahoo Finance"
      region: "Brazil"
      
  optional:
    - symbol: "GBPUSD=X"
      name: "GBP/USD"
      source: "Yahoo Finance"
      
    - symbol: "JPY=X"
      name: "JPY/USD"
      source: "Yahoo Finance"
      status: "MISSING - Add to collection"
      
    - symbol: "CNY=X"
      name: "CNY/USD"
      source: "Yahoo Finance"
      status: "MISSING - Add to collection"

# =============================================================================
# CRYPTOCURRENCIES
# =============================================================================

cryptocurrencies:
  required:
    - symbol: "BTC-USD"
      name: "Bitcoin"
      source: "Yahoo Finance"
      frequency: "daily"
      used_in: ["crypto_prices.csv"]
      
    - symbol: "ETH-USD"
      name: "Ethereum"
      source: "Yahoo Finance"
      frequency: "daily"
      used_in: ["crypto_prices.csv"]
      
    - symbol: "SOL-USD"
      name: "Solana"
      source: "Yahoo Finance"
      frequency: "daily"
      used_in: ["crypto_prices.csv"]

# =============================================================================
# FRED SERIES (Macro Data)
# =============================================================================

fred_series:
  treasury_yields:
    - series_id: "DGS2"
      name: "2-Year Treasury Yield"
      frequency: "daily"
      used_in: ["treasury_yields.csv"]
      
    - series_id: "DGS5"
      name: "5-Year Treasury Yield"
      frequency: "daily"
      used_in: ["treasury_yields.csv"]
      
    - series_id: "DGS10"
      name: "10-Year Treasury Yield"
      frequency: "daily"
      used_in: ["treasury_yields.csv"]
      
    - series_id: "DGS30"
      name: "30-Year Treasury Yield"
      frequency: "daily"
      used_in: ["treasury_yields.csv"]
      
  money_supply:
    - series_id: "M2SL"
      name: "M2 Money Supply"
      frequency: "monthly"
      publication_lag: "3-4 weeks"
      used_in: ["global_liquidity.csv"]
      
  real_yields:
    - series_id: "DFII10"
      name: "10-Year TIPS Yield"
      frequency: "daily"
      used_in: ["real_yields.csv"]
      
  fed_funds:
    - series_id: "FEDFUNDS"
      name: "Federal Funds Rate"
      frequency: "monthly"
      
  credit_spreads:
    - series_id: "BAMLH0A0HYM2"
      name: "High Yield OAS Spread"
      frequency: "daily"
      used_in: ["credit_spreads.csv"]

