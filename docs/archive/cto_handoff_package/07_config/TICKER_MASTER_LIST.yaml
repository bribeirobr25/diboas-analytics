# =============================================================================
# API ENDPOINTS
# =============================================================================

api_endpoints:
  alternative_me:
    name: "Crypto Fear & Greed Index"
    url: "https://api.alternative.me/fng/"
    auth_required: false
    rate_limit: "~30/minute"
    used_in: ["sentiment_indicators.csv"]
    
  defillama:
    base_url: "https://api.llama.fi"
    endpoints:
      pools: "/pools"
      treasuries: "/treasuries"
      tvl: "/tvl"
    auth_required: false
    
  fred:
    base_url: "https://api.stlouisfed.org/fred/series/observations"
    auth_required: true
    note: "Free API key from fred.stlouisfed.org"

# =============================================================================
# ROTATION RATIOS (Calculated, not collected)
# =============================================================================

rotation_ratios:
  phase_1:
    - name: "SPY/TLT"
      formula: "SPY close / TLT close"
      interpretation: "High = Risk-On, Low = Risk-Off"
      ma_period: 50
      
    - name: "Copper/Gold"
      formula: "HG=F / GC=F"
      interpretation: "Rising = Economic optimism"
      note: "Result will be small (~0.0017) due to unit difference"
      
    - name: "XLF/XLU"
      formula: "XLF close / XLU close"
      interpretation: "High = Cyclical, Low = Defensive"
      
    - name: "IWM/SPY"
      formula: "IWM close / SPY close"
      interpretation: "High = Risk appetite, Low = Flight to quality"
      
  phase_2:
    - name: "Gold/BTC"
      formula: "GC=F / BTC-USD"
      status: "Phase 2"
      
    - name: "DXY Trend"
      formula: "DXY vs 50-day MA"
      status: "Phase 2"

# =============================================================================
# OUTPUT FILES MAPPING
# =============================================================================

output_files:
  - file: "treasury_yields.csv"
    columns: ["date", "yield_2y", "yield_5y", "yield_10y", "yield_30y"]
    sources: ["FRED DGS2", "FRED DGS5", "FRED DGS10", "FRED DGS30"]
    
  - file: "global_liquidity.csv"
    columns: ["date", "us_m2_bn", "us_m2_yoy"]
    sources: ["FRED M2SL"]
    
  - file: "real_yields.csv"
    columns: ["date", "real_yield_10y"]
    sources: ["FRED DFII10"]
    
  - file: "tradfi_benchmark_data.csv"
    format: "WIDE (one column per ticker)"
    columns: ["date", "spy_close", "tlt_close", "xlf_close", "xlu_close", "iwm_close", "gspc_close", "ixic_close", "vix_close"]
    sources: ["Yahoo Finance"]
    
  - file: "commodities.csv"
    columns: ["date", "gold_close", "copper_close"]
    sources: ["Yahoo Finance GC=F", "Yahoo Finance HG=F"]
    
  - file: "credit_spreads.csv"
    columns: ["date", "hy_oas_spread", "ig_spread"]
    sources: ["FRED BAMLH0A0HYM2"]
    
  - file: "crypto_prices.csv"
    columns: ["date", "btc_close", "eth_close", "sol_close"]
    sources: ["Yahoo Finance BTC-USD", "Yahoo Finance ETH-USD", "Yahoo Finance SOL-USD"]
    
  - file: "rotation_indicators.csv"
    columns: ["date", "spy_tlt_ratio", "copper_gold_ratio", "xlf_xlu_ratio", "iwm_spy_ratio", "spy_tlt_ma50", "spy_tlt_signal"]
    sources: ["Calculated from tradfi_benchmark_data.csv and commodities.csv"]
    
  - file: "sentiment_indicators.csv"
    columns: ["date", "fear_greed_index", "fear_greed_label"]
    sources: ["Alternative.me API"]
    
  - file: "estate_wallet_tracker.csv"
    columns: ["entity", "wallet_address", "chain", "last_known_balance", "estimated_usd_value", "risk_tier"]
    note: "Column is 'entity', NOT 'entity_name'"

# =============================================================================
# END OF TICKER MASTER LIST
# =============================================================================
